name = "ddiia-telegram-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Секреты (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) НЕ хранятся здесь.
# Они заданы через `wrangler secret put` и хранятся зашифрованными в Cloudflare.

[vars]
# Список доменов, которым разрешено слать формы через этот воркер.
ALLOWED_ORIGINS = "https://ddiia.com,https://www.ddiia.com"
